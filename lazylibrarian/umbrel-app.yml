manifestVersion: 1
id: lazylibrarian
category: media
name: LazyLibrarian
version: "4529bef5-ls308"
tagline: Follow authors and download books, audiobooks, magazines, and comics
description: >-
  LazyLibrarian is a digital reading manager for ebooks, audiobooks, magazines, and comics. It can follow authors, fetch book metadata, mark wanted titles, search configured providers, and send matching releases to supported download clients such as SABnzbd, NZBGet, Transmission, qBittorrent, Deluge, rTorrent, and blackhole/watch folders.


  SETUP INSTRUCTIONS


  LazyLibrarian stores its app configuration in persistent Umbrel app data and has access to your shared Umbrel Downloads folder at `/downloads`.


  Recommended first-run paths:


  - Use `/downloads/books` as your ebook library or completed ebook folder.

  - Use `/downloads/audiobooks` as your audiobook folder if you manage audiobooks with LazyLibrarian.

  - Configure your download client in LazyLibrarian's settings. Transmission, qBittorrent, and SABnzbd can be installed separately from the Umbrel App Store.

  - Add your preferred providers/indexers in LazyLibrarian. Prowlarr can also be used as a Torznab/Newznab provider source.


  LazyLibrarian opens behind your Umbrel login by default. If you expose it outside Umbrel's protected app proxy, configure LazyLibrarian's own authentication in its interface settings.
releaseNotes: ""

